<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Start IPL Prediction</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{

    min-height:100vh;

    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url("/static/images/front_page_bg.jpeg");

    background-size:cover;
    background-position:center;
    background-attachment:fixed;

    color:white;

    display:flex;
    justify-content:center;
    align-items:center;
}

.container{

    width:480px;

    background:rgba(0,0,0,0.78);

    padding:30px;

    border-radius:18px;

    box-shadow:0 0 25px rgba(0,0,0,0.6);
}

h1{

    text-align:center;

    margin-bottom:10px;

    font-size:30px;
}

.subtitle{

    text-align:center;

    color:#cccccc;

    margin-bottom:25px;

    font-size:16px;
}

label{

    display:block;

    margin-top:15px;

    margin-bottom:7px;

    font-size:16px;
}

select,
input{

    width:100%;

    padding:12px;

    border:none;

    border-radius:7px;

    font-size:15px;
}

button{

    width:100%;

    padding:13px;

    margin-top:25px;

    background:#ffa500;

    color:white;

    border:none;

    border-radius:8px;

    font-size:17px;

    font-weight:bold;

    cursor:pointer;
}

button:hover{

    background:#ff8c00;

    transform:scale(1.02);
}

.back{

    display:block;

    text-align:center;

    margin-top:18px;

    color:#cccccc;

    text-decoration:none;

}

.back:hover{

    color:#ffa500;
}

</style>

</head>

<body>

<div class="container">

    <h1>
        📈 Start IPL Prediction
    </h1>

    <div class="subtitle">
        Enter the current match details
    </div>

    <form action="{{ url_for('predict') }}" method="post">

        <label>
            Batting Team
        </label>

        <select name="batting_team" required>

            <option value="">Select Batting Team</option>

            <option value="CSK">CSK</option>
            <option value="MI">MI</option>
            <option value="RCB">RCB</option>
            <option value="KKR">KKR</option>
            <option value="SRH">SRH</option>
            <option value="RR">RR</option>
            <option value="DC">DC</option>
            <option value="PBKS">PBKS</option>
            <option value="GT">GT</option>
            <option value="LSG">LSG</option>

        </select>


        <label>
            Bowling Team
        </label>

        <select name="bowling_team" required>

            <option value="">Select Bowling Team</option>

            <option value="CSK">CSK</option>
            <option value="MI">MI</option>
            <option value="RCB">RCB</option>
            <option value="KKR">KKR</option>
            <option value="SRH">SRH</option>
            <option value="RR">RR</option>
            <option value="DC">DC</option>
            <option value="PBKS">PBKS</option>
            <option value="GT">GT</option>
            <option value="LSG">LSG</option>

        </select>


        <label>
            Current Score
        </label>

        <input
            type="number"
            name="score"
            placeholder="Enter Current Score"
            min="0"
            required
        >


        <label>
            Overs
        </label>

        <input
            type="number"
            name="overs"
            placeholder="Example: 10.2"
            min="0"
            max="20"
            step="0.1"
            required
        >


        <label>
            Wickets
        </label>

        <input
            type="number"
            name="wickets"
            placeholder="Enter Wickets"
            min="0"
            max="10"
            required
        >


        <button type="submit">
            🔮 Predict Score
        </button>

    </form>


    <a href="{{ url_for('home') }}" class="back">
        ← Back to Home
    </a>

</div>

</body>

</html>
